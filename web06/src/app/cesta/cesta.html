<div class="row">
  <div class="card col-12 col-sm-12 col-md-6 col-lg-4" *ngFor="let obj of lista">
    <img class="card-img-top" src="{{ obj.codigo }}.jpg" style="width: 100%" />

    <div class="card-body">
      <h4 class="card-title">
        {{ obj.nome }}
      </h4>

      <p class="card-text">Quantidade: {{ obj.quantidade }}</p>
      <p class="card-text">Valor unitário: R$ {{ obj.valor }}</p>
      <p class="card-text">Total: R$ {{ obj.valor * obj.quantidade }}</p>

      <a href="#" class="btn btn-danger"> Remover </a>
    </div>
  </div>
</div>
