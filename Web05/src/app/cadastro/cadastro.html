<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow">
        <div class="card-header cabecalho text-center">
          <h3 class="mb-0">Cadastro</h3>
        </div>

        <div class="card-body">
          <form [formGroup]="cadastro" (ngSubmit)="cadastrar()">
            <div class="mb-3">
              <label for="nome" class="form-label">Nome</label>
              <input type="text" id="nome" class="form-control" placeholder="Digite seu nome" formControlName="nome">
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" id="email" class="form-control" placeholder="Digite seu e-mail" formControlName="email">
            </div>

            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" id="senha" class="form-control" placeholder="Digite sua senha" formControlName="senha">
            </div>

            <div class="mb-3">
              <label for="confirmarSenha" class="form-label">Confirmar senha</label>
              <input type="password" id="confirmarSenha" class="form-control"placeholder="Digite a senha novamente" formControlName="confirmarSenha">
            </div>

            <div class="mb-3">
              <label for="nascimento" class="form-label">Data de nascimento</label>
              <input type="date" id="nascimento" class="form-control" formControlName="nascimento">
            </div>

            <div class="mb-3">
              <label for="cidade" class="form-label">Cidade</label>
              <input type="text" id="cidade" class="form-control" placeholder="Digite sua cidade" formControlName="cidade">
            </div>

            <div class="mb-3">
              <label for="estado" class="form-label">Estado</label>
              <select id="estado" class="form-select" formControlName="estado">
                <option value="">Selecione seu estado</option>
                <option value="AL">Alagoas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceará</option>
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espírito Santo</option>
                <option value="GO">Goiás</option>
                <option value="MA">Maranhão</option>
                <option value="MG">Minas Gerais</option>
                <option value="PE">Pernambuco</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
              </select>
            </div>

            <div class="form-check mb-4">
              <input type="checkbox" id="termos" class="form-check-input" formControlName="termos">
              <label for="termos" class="form-check-label">Aceito os termos e condições</label>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">Cadastrar</button>
            </div>
          </form>
        </div>

        <div class="card-footer text-center">
          <small class="text-muted"> Possui uma conta?
            <a href="#" class="text-decoration-none">Entrar</a>
          </small>
        </div>
      </div>
    </div>
  </div>
</div>
